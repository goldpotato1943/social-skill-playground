<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>소셜스킬 놀이터</title>
<style>
  :root{
    --bg:#FFF9F0;
    --ink:#3A2E2A;
    --sub:#8A7A72;
    --card-bg:#FFFFFF;
    --shadow: 0 6px 16px rgba(58,46,42,0.10);
    --radius: 22px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",-apple-system,sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
  }
  .wrap{
    max-width:1080px;
    margin:0 auto;
    padding:40px 24px 80px;
  }
  header{
    text-align:center;
    margin-bottom:40px;
  }
  header h1{
    font-size:2.7rem;
    margin:0 0 10px;
  }
  header p{
    font-size:1.2rem;
    color:var(--sub);
    margin:0;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:24px;
  }
  @media (max-width:900px){
    .grid{grid-template-columns:repeat(2,1fr);}
  }
  @media (max-width:600px){
    .grid{grid-template-columns:1fr;}
    header h1{font-size:2.1rem;}
    .modal{padding:26px 22px 28px;}
    .situation-box{font-size:1.15rem;padding:20px;}
    .option-btn{font-size:1.05rem;padding:14px 10px;}
    .check-item{font-size:1.05rem;padding:14px 16px;}
    .sentence-result{font-size:1.2rem;padding:20px;}
  }
  .card{
    background:var(--card-bg);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:26px 22px;
    cursor:pointer;
    border:3px solid transparent;
    transition:transform .15s ease, border-color .15s ease;
    display:flex;
    flex-direction:column;
    gap:10px;
    text-align:center;
  }
  .card:hover{
    transform:translateY(-4px);
  }
  .card:active{transform:translateY(-1px) scale(.99);}
  .card .icon{
    font-size:2.6rem;
    width:72px;height:72px;
    display:flex;align-items:center;justify-content:center;
    margin:0 auto;
    border-radius:50%;
  }
  .card h2{
    font-size:1.45rem;
    margin:4px 0 0;
  }
  .card .desc{
    font-size:1.05rem;
    color:var(--sub);
    line-height:1.45;
    min-height:2.9em;
  }
  .stars{
    font-size:1.35rem;
    letter-spacing:2px;
  }
  .stars .on{color:#FFB800;}
  .stars .off{color:#E5DDD3;}
  .start-hint{
    margin-top:auto;
    font-size:1rem;
    font-weight:700;
    padding:8px 0 2px;
  }

  /* Modal */
  .overlay{
    position:fixed;inset:0;
    background:rgba(58,46,42,.55);
    display:flex;align-items:center;justify-content:center;
    padding:20px;
    z-index:100;
    opacity:0;pointer-events:none;
    transition:opacity .2s ease;
  }
  .overlay.open{opacity:1;pointer-events:auto;}
  .modal{
    background:var(--card-bg);
    border-radius:26px;
    width:100%;max-width:720px;
    max-height:92vh;
    overflow-y:auto;
    padding:38px 40px 40px;
    position:relative;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
  }
  .modal-close{
    position:absolute;
    top:20px;right:22px;
    background:none;border:none;
    font-size:1.7rem;
    cursor:pointer;
    color:var(--sub);
    line-height:1;
  }
  .modal-head{
    display:flex;align-items:center;gap:12px;
    margin-bottom:8px;
  }
  .modal-head .icon{
    font-size:2.1rem;
  }
  .modal-head h2{
    margin:0;font-size:1.6rem;
  }
  .progress{
    display:flex;gap:6px;margin:20px 0 26px;
  }
  .progress span{
    flex:1;height:8px;border-radius:5px;
    background:#EEE6DC;
  }
  .progress span.done{background:var(--accent,#8B5CF6);}
  .step-label{
    font-size:1rem;
    font-weight:700;
    color:var(--accent,#8B5CF6);
    margin-bottom:8px;
  }
  .situation-box{
    background:var(--accent-light,#F3E8FF);
    border-radius:16px;
    padding:26px;
    font-size:1.35rem;
    line-height:1.6;
    margin-bottom:6px;
  }
  .option-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    margin-top:16px;
  }
  .option-btn{
    border:2px solid #EEE6DC;
    background:#FFF;
    border-radius:14px;
    padding:18px 14px;
    font-size:1.2rem;
    cursor:pointer;
    text-align:center;
    transition:.15s;
  }
  .option-btn:hover{border-color:var(--accent,#8B5CF6);}
  .option-btn.selected{
    border-color:var(--accent,#8B5CF6);
    background:var(--accent-light,#F3E8FF);
    font-weight:700;
  }
  .check-list{
    display:flex;flex-direction:column;gap:12px;
    margin-top:16px;
  }
  .check-item{
    display:flex;align-items:center;gap:14px;
    border:2px solid #EEE6DC;
    border-radius:14px;
    padding:18px 20px;
    cursor:pointer;
    font-size:1.2rem;
    transition:.15s;
  }
  .check-item.checked{
    border-color:var(--accent,#8B5CF6);
    background:var(--accent-light,#F3E8FF);
  }
  .check-box{
    width:26px;height:26px;border-radius:8px;
    border:2px solid #D8CCC0;
    flex:none;
    display:flex;align-items:center;justify-content:center;
    font-size:1rem;
    background:#fff;
  }
  .check-item.checked .check-box{
    background:var(--accent,#8B5CF6);
    border-color:var(--accent,#8B5CF6);
    color:#fff;
  }
  .sentence-result{
    background:var(--accent-light,#F3E8FF);
    border-radius:16px;
    padding:26px;
    font-size:1.45rem;
    font-weight:700;
    text-align:center;
    margin-top:18px;
    line-height:1.55;
  }
  .nav-row{
    display:flex;gap:12px;margin-top:30px;
  }
  .btn{
    flex:1;
    border:none;
    border-radius:14px;
    padding:16px 10px;
    font-size:1.2rem;
    font-weight:700;
    cursor:pointer;
    transition:.15s;
  }
  .btn-primary{
    background:var(--accent,#8B5CF6);
    color:#fff;
  }
  .btn-primary:disabled{
    background:#E5DDD3;
    cursor:not-allowed;
  }
  .btn-ghost{
    background:#F3EFE9;
    color:var(--ink);
    flex:none;
    width:120px;
  }
  .complete-wrap{
    text-align:center;
    padding:10px 0 0;
  }
  .complete-wrap .big-emoji{
    font-size:3.6rem;
    margin-bottom:12px;
  }
  .complete-wrap h3{
    margin:0 0 10px;
    font-size:1.6rem;
  }
  .complete-wrap p{
    color:var(--sub);
    font-size:1.15rem;
    margin:0 0 20px;
  }
  .rate-stars{
    display:flex;
    flex-direction:row-reverse;
    justify-content:center;
    gap:8px;
    font-size:2.6rem;
    cursor:pointer;
    margin-bottom:26px;
  }
  .rate-stars span{
    color:#E5DDD3;
    transition:color .1s, transform .1s;
  }
  .rate-stars span.on{color:#FFB800;}
  .rate-stars span:hover,
  .rate-stars span:hover ~ span{
    color:#FFB800;
    transform:scale(1.12);
  }

  .student-badge{
    display:flex;align-items:center;justify-content:center;gap:8px;
    margin-top:14px;
    font-size:1rem;
    color:var(--sub);
  }
  .student-badge b{color:var(--ink);}
  .student-badge button{
    border:none;background:none;color:var(--sub);
    cursor:pointer;font-size:.95rem;text-decoration:underline;
  }
  .name-gate input{
    width:100%;
    font-size:1.2rem;
    padding:16px 18px;
    border-radius:14px;
    border:2px solid #EEE6DC;
    margin:18px 0 22px;
  }
  .name-gate input:focus{outline:none;border-color:#8B5CF6;}
  footer{
    text-align:center;
    margin-top:48px;
  }
  footer a{color:var(--sub);font-size:.9rem;text-decoration:none;}
  footer a:hover{text-decoration:underline;}
</style>
</head>
<body>

    <p>여섯 가지 놀이를 통해 마음을 배워요</p>
    <div class="student-badge" id="studentBadge"></div>

const API_URL = (window.SSP_CONFIG && window.SSP_CONFIG.API_URL) || '';
const RATE_KEY = 'ssp_ratings';
const NAME_KEY = 'ssp_name';

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function loadRatings(){
  try{ return JSON.parse(localStorage.getItem(RATE_KEY)) || {}; }catch(e){ return {}; }
}
function saveRating(id, stars){
  const r = loadRatings();
  if(!r[id] || stars > r[id]) r[id] = stars;
  try{ localStorage.setItem(RATE_KEY, JSON.stringify(r)); }catch(e){}
}
function getName(){
  try{ return localStorage.getItem(NAME_KEY) || ''; }catch(e){ return ''; }
}
function setName(name){
  try{ localStorage.setItem(NAME_KEY, name); }catch(e){}
}
function submitResult(activityId, activityTitle, stars){
  const name = getName();
  if(!name || !API_URL) return;
  // text/plain으로 보내야 Apps Script에서 CORS 사전요청 없이 받을 수 있어요
  fetch(API_URL, {
    method:'POST',
    headers:{'content-type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ action:'add', name, activityId, activityTitle, stars })
  }).catch(()=>{});
}

let state = null;

function renderStudentBadge(){
  const badge = document.getElementById('studentBadge');
  const name = getName();
  badge.innerHTML = name
    ? `👤 <b>${esc(name)}</b> 학생 <button onclick="openNameGate()">이름 바꾸기</button>`
    : '';
}

function openNameGate(){
  const hasName = !!getName();
  document.getElementById('overlay').classList.add('open');
  const modal = document.getElementById('modal');
  modal.innerHTML = `
    ${hasName ? `<button class="modal-close" onclick="closeModal()">✕</button>` : ''}
    <div class="name-gate">
      <div class="modal-head">
        <div class="icon">👋</div>
        <h2>이름을 알려주세요</h2>
      </div>
      <div class="step-label" style="color:#8B5CF6">선생님이 우리 반 활동 결과를 확인할 수 있어요</div>
      <input id="nameInput" type="text" placeholder="예) 김민준" maxlength="10" value="${esc(getName())}" />
      <div class="nav-row">
        <button class="btn btn-primary" onclick="confirmName()">시작하기</button>
      </div>
    </div>
  `;
  const input = document.getElementById('nameInput');
  input.focus();
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') confirmName(); });
}

function confirmName(){
  const val = document.getElementById('nameInput').value.trim().slice(0,10);
  if(!val) return;
  setName(val);
  renderStudentBadge();
  document.getElementById('overlay').classList.remove('open');
}

function starHTML(count){
  let s='';
  for(let i=1;i<=5;i++) s += `<span class="${i<=count?'on':'off'}">★</span>`;
  return s;
}

function renderGrid(){
  const ratings = loadRatings();
  const grid = document.getElementById('grid');
  grid.innerHTML = ACTIVITIES.map(a => `
    <div class="card" style="border-color:${ratings[a.id]?a.color:'transparent'}" onclick="openActivity('${a.id}')">
      <div class="icon" style="background:${a.colorLight}">${a.icon}</div>
      <h2>${a.title}</h2>
      <div class="desc">${a.desc}</div>
      <div class="stars">${starHTML(ratings[a.id]||0)}</div>
      <div class="start-hint" style="color:${a.color}">시작하기 ▶</div>
    </div>
  `).join('');
}

function openActivity(id){
  const activity = ACTIVITIES.find(a=>a.id===id);
  const scenario = activity.scenarios[Math.floor(Math.random()*activity.scenarios.length)];
  state = { activity, scenario, step:0, emotion:null, checked:new Set(), sentence:null };
  document.getElementById('overlay').classList.add('open');
  renderModal();
}

function closeModal(){
  document.getElementById('overlay').classList.remove('open');
  renderGrid();
}

function setVars(a){
  const modal = document.getElementById('modal');
  modal.style.setProperty('--accent', a.color);
  modal.style.setProperty('--accent-light', a.colorLight);
}

function renderModal(){
  const { activity, scenario, step } = state;
  setVars(activity);
  const modal = document.getElementById('modal');

  if(step >= 4){
    modal.innerHTML = `
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div class="complete-wrap">
        <div class="big-emoji">🎉</div>
        <h3>${activity.title} 완성!</h3>
        <p>오늘도 마음을 잘 전했어요. 별점을 매겨볼까요?</p>
        <div class="rate-stars" id="rateStars">
          <span data-v="5" onclick="setStars(5)">★</span>
          <span data-v="4" onclick="setStars(4)">★</span>
          <span data-v="3" onclick="setStars(3)">★</span>
          <span data-v="2" onclick="setStars(2)">★</span>
          <span data-v="1" onclick="setStars(1)">★</span>
        </div>
        <div class="nav-row">
          <button class="btn btn-primary" onclick="finishActivity()">완료하고 돌아가기</button>
        </div>
      </div>
    `;
    pendingStars = 0;
    return;
  }

  const progress = activity.steps.map((_,i)=>`<span class="${i<=step?'done':''}"></span>`).join('');
  const stepLabel = activity.steps[step];

  let body = '';
  if(step===0){
    body = `<div class="situation-box">${scenario.situation}</div>`;
  } else if(step===1){
    body = `<div class="situation-box">${scenario.situation}</div>
      <div class="option-grid">
        ${scenario.emotions.map((e,i)=>`<button class="option-btn ${state.emotion===e?'selected':''}" onclick="pickEmotion(${i})">${e}</button>`).join('')}
      </div>`;
  } else if(step===2){
    body = `<div class="check-list">
      ${scenario.gestures.map((g,i)=>`<div class="check-item ${state.checked.has(i)?'checked':''}" onclick="toggleGesture(${i})">
        <div class="check-box">${state.checked.has(i)?'✓':''}</div>
        <div>${g}</div>
      </div>`).join('')}
    </div>`;
  } else if(step===3){
    body = `<div class="option-grid" style="grid-template-columns:1fr;">
      ${scenario.sentences.map((s,i)=>`<button class="option-btn ${state.sentence===s?'selected':''}" onclick="pickSentence(${i})">${s}</button>`).join('')}
      </div>
      ${state.sentence ? `<div class="sentence-result">"${state.sentence}"</div>` : ''}
    `;
  }

  const nextEnabled =
    (step===0) ||
    (step===1 && state.emotion) ||
    (step===2 && state.checked.size===scenario.gestures.length) ||
    (step===3 && state.sentence);

  modal.innerHTML = `
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-head">
      <div class="icon">${activity.icon}</div>
      <h2>${activity.title}</h2>
    </div>
    <div class="progress">${progress}</div>
    <div class="step-label">${step+1}단계 · ${stepLabel}</div>
    ${body}
    <div class="nav-row">
      ${step>0 ? `<button class="btn btn-ghost" onclick="prevStep()">이전</button>` : ''}
      <button class="btn btn-primary" ${nextEnabled?'':'disabled'} onclick="nextStep()">${step===3?'완료하기':'다음'}</button>
    </div>
  `;
}

function pickEmotion(i){ state.emotion = state.scenario.emotions[i]; renderModal(); }
function toggleGesture(i){
  if(state.checked.has(i)) state.checked.delete(i); else state.checked.add(i);
  renderModal();
}
function pickSentence(i){ state.sentence = state.scenario.sentences[i]; renderModal(); }
function prevStep(){ state.step--; renderModal(); }
function nextStep(){ state.step++; renderModal(); }

let pendingStars = 0;
function setStars(n){
  pendingStars = n;
  document.getElementById('rateStars').querySelectorAll('span').forEach(s=>{
    s.classList.toggle('on', Number(s.dataset.v) <= n);
  });
}
function finishActivity(){
  if(pendingStars>0){
    saveRating(state.activity.id, pendingStars);
    submitResult(state.activity.id, state.activity.title, pendingStars);
  }
  closeModal();
}

renderGrid();
renderStudentBadge();
if(!getName()) openNameGate();
</script>
</body>
</html>
